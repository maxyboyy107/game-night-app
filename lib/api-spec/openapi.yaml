openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Catalog
    description: Shared game catalog and protected admin editing.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Community
    description: User profiles, favorites, game sessions, and leaderboards.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get the shared game catalog
      responses:
        "200":
          description: Current catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
    put:
      tags: [Catalog]
      operationId: saveCatalog
      summary: Save the shared game catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "200":
          description: Saved catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
  /catalog/admin/unlock:
    post:
      tags: [Catalog]
      operationId: unlockCatalogAdmin
      summary: Unlock catalog editing for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockInput"
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUnlockResponse"
        "401":
          description: Sign-in required
        "403":
          description: Incorrect admin password
  /catalog/admin/status:
    get:
      tags: [Catalog]
      operationId: getCatalogAdminStatus
      summary: Check whether catalog editing is unlocked
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatusResponse"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a signed-in user's image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Sign-in required
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
  /profile:
    get:
      tags: [Community]
      operationId: getProfile
      summary: Get the signed-in user's profile and game history
      responses:
        "200":
          description: Profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
    put:
      tags: [Community]
      operationId: updateProfile
      summary: Change the signed-in user's display username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid username
        "401":
          description: Sign-in required
        "409":
          description: Username already in use
  /profile/avatar:
    put:
      tags: [Community]
      operationId: updateProfileAvatar
      summary: Save a profile image uploaded to App Storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileAvatarUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
  /profile/favorites/{gameSlug}:
    put:
      tags: [Community]
      operationId: setGameFavorite
      summary: Add or remove a game from the signed-in user's favorites
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteUpdate"
      responses:
        "200":
          description: Favorite state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /games/{gameSlug}/sessions:
    post:
      tags: [Community]
      operationId: startGameSession
      summary: Start and save a game session
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Started game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid players
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /games/sessions/{sessionId}:
    get:
      tags: [Community]
      operationId: getGameSession
      summary: Get a saved session owned by the signed-in user
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "401":
          description: Sign-in required
        "404":
          description: Session not found
    patch:
      tags: [Community]
      operationId: finishGameSession
      summary: Save final scores and complete a game session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionFinish"
      responses:
        "200":
          description: Completed game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid final scores
        "401":
          description: Sign-in required
        "404":
          description: Session not found
  /games/{gameSlug}/leaderboard:
    get:
      tags: [Community]
      operationId: getGameLeaderboard
      summary: Get the best completed scores for a game
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameCategory:
      type: object
      required: [slug, name, description, color]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        children:
          type: array
          items: { type: string }
    Game:
      type: object
      required: [slug, title, alternateNames, categorySlugs, eyebrow, description, players, setup, age, duration, equipment, objective, rules, accent, icon]
      properties:
        slug: { type: string }
        title: { type: string }
        alternateNames: { type: array, items: { type: string } }
        categorySlugs: { type: array, items: { type: string } }
        eyebrow: { type: string }
        description: { type: string }
        players: { type: string }
        setup: { type: string }
        age: { type: string }
        duration: { type: string }
        equipment: { type: array, items: { type: string } }
        objective: { type: string }
        rules: { type: array, items: { type: string } }
        accent: { type: string }
        icon: { type: string }
        articleMarkdown: { type: string }
    InventoryItem:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        imageDataUrl: { type: [string, "null"] }
        imagePath: { type: [string, "null"] }
    CatalogState:
      type: object
      required: [categories, primaryCategories, games, inventory]
      properties:
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GameCategory"
        primaryCategories: { type: array, items: { type: string } }
        games: { type: array, items: { $ref: "#/components/schemas/Game" } }
        inventory:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/InventoryItem" }
    CatalogInput:
      $ref: "#/components/schemas/CatalogState"
    AdminUnlockInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminUnlockResponse:
      type: object
      required: [unlocked]
      properties:
        unlocked: { type: boolean }
    AdminStatusResponse:
      type: object
      required: [unlocked]
      properties:
        unlocked: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ProfileUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-zA-Z0-9_]+$"
    ProfileAvatarUpdate:
      type: object
      required: [avatarPath]
      properties:
        avatarPath: { type: string, minLength: 1 }
    ProfileStats:
      type: object
      required: [gamesPlayed, wins, highScore]
      properties:
        gamesPlayed: { type: integer }
        wins: { type: integer }
        highScore: { type: integer }
    SessionPlayerInput:
      type: object
      required: [name, isYou]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        isYou: { type: boolean }
    SessionPlayer:
      type: object
      required: [name, score, isYou]
      properties:
        name: { type: string }
        score: { type: integer }
        isYou: { type: boolean }
    GameSessionInput:
      type: object
      required: [players]
      properties:
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayerInput" }
    GameSessionFinish:
      type: object
      required: [players]
      properties:
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayer" }
    GameSession:
      type: object
      required: [id, gameSlug, players, score, status, won, startedAt]
      properties:
        id: { type: string, format: uuid }
        gameSlug: { type: string }
        gameTitle: { type: string }
        players: { type: array, items: { $ref: "#/components/schemas/SessionPlayer" } }
        score: { type: integer }
        status: { type: string, enum: [active, complete] }
        winnerName: { type: [string, "null"] }
        won: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    ProfileSummary:
      type: object
      required: [username, favorites, stats, recentGames, bestGames]
      properties:
        username: { type: string }
        avatarPath: { type: [string, "null"] }
        favorites: { type: array, items: { type: string } }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        recentGames: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
        bestGames: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
    FavoriteUpdate:
      type: object
      required: [favorited]
      properties:
        favorited: { type: boolean }
    FavoriteResponse:
      type: object
      required: [gameSlug, favorited]
      properties:
        gameSlug: { type: string }
        favorited: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [username, score, gamesPlayed, wins]
      properties:
        username: { type: string }
        avatarPath: { type: [string, "null"] }
        score: { type: integer }
        gamesPlayed: { type: integer }
        wins: { type: integer }
    Leaderboard:
      type: object
      required: [gameSlug, entries]
      properties:
        gameSlug: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/LeaderboardEntry" } }

