openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Catalog
    description: Shared game catalog and protected admin editing.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Community
    description: User profiles, favorites, game sessions, and leaderboards.
  - name: GameNights
    description: Persistent groups, invitations, family profiles, house rules, and local games.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get the shared game catalog
      responses:
        "200":
          description: Current catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
    put:
      tags: [Catalog]
      operationId: saveCatalog
      summary: Save the shared game catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "200":
          description: Saved catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
  /catalog/backup:
    get:
      tags: [Catalog]
      operationId: exportCatalogBackup
      summary: Export the shared catalog for safekeeping
      responses:
        "200":
          description: Downloadable catalog backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBackup"
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
    put:
      tags: [Catalog]
      operationId: restoreCatalogBackup
      summary: Restore the shared catalog from a backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogBackupInput"
      responses:
        "200":
          description: Catalog backup restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
        "400":
          description: Invalid backup
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
  /catalog/admin/unlock:
    post:
      tags: [Catalog]
      operationId: unlockCatalogAdmin
      summary: Unlock catalog editing for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockInput"
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUnlockResponse"
        "401":
          description: Sign-in required
        "403":
          description: Incorrect admin password
  /catalog/admin/status:
    get:
      tags: [Catalog]
      operationId: getCatalogAdminStatus
      summary: Check whether catalog editing is unlocked
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatusResponse"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a signed-in user's image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Sign-in required
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
  /profile:
    get:
      tags: [Community]
      operationId: getProfile
      summary: Get the signed-in user's profile and game history
      responses:
        "200":
          description: Profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
    put:
      tags: [Community]
      operationId: updateProfile
      summary: Change the signed-in user's display username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid username
        "401":
          description: Sign-in required
        "409":
          description: Username already in use
  /profile/games:
    get:
      tags: [Community]
      operationId: getProfileGames
      summary: Get all saved games for the signed-in user
      responses:
        "200":
          description: Saved game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionList"
        "401":
          description: Sign-in required
    post:
      tags: [Community]
      operationId: createHistoricalGame
      summary: Add a previously played game to the signed-in user's history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalGameInput"
      responses:
        "201":
          description: Historical game added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid historical game
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /profile/backup:
    get:
      tags: [Community]
      operationId: exportProfileBackup
      summary: Export the signed-in user's profile, family, and game history
      responses:
        "200":
          description: Downloadable profile backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBackup"
        "401":
          description: Sign-in required
    post:
      tags: [Community]
      operationId: restoreProfileBackup
      summary: Restore profile data from a backup for the same account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileBackupInput"
      responses:
        "200":
          description: Profile backup restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid backup or account mismatch
        "401":
          description: Sign-in required
  /profile/avatar:
    put:
      tags: [Community]
      operationId: updateProfileAvatar
      summary: Save a profile image uploaded to App Storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileAvatarUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
  /profile/family-members:
    post:
      tags: [Community]
      operationId: createFamilyMember
      summary: Add a family profile to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberInput"
      responses:
        "201":
          description: Created family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "400":
          description: Invalid family member name
        "401":
          description: Sign-in required
  /profile/family-members/{familyMemberId}:
    patch:
      tags: [Community]
      operationId: updateFamilyMember
      summary: Rename or archive a family profile owned by the signed-in account
      parameters:
        - name: familyMemberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberUpdate"
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "400":
          description: Invalid update
        "401":
          description: Sign-in required
        "404":
          description: Family member not found
  /profile/family-members/{familyMemberId}/history:
    get:
      tags: [Community]
      operationId: getFamilyMemberHistory
      summary: Get completed games for a family profile owned by the signed-in account
      parameters:
        - name: familyMemberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Family member profile and completed game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberHistory"
        "401":
          description: Sign-in required
        "404":
          description: Family member not found
  /profile/favorites/{gameSlug}:
    put:
      tags: [Community]
      operationId: setGameFavorite
      summary: Add or remove a game from the signed-in user's favorites
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteUpdate"
      responses:
        "200":
          description: Favorite state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /game-nights:
    get:
      tags: [GameNights]
      operationId: listGameNights
      summary: List this account's Game Nights and invitations
      responses:
        "200":
          description: Groups and pending private invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightList" }
        "401":
          description: Sign-in required
    post:
      tags: [GameNights]
      operationId: createGameNight
      summary: Create a persistent Game Night
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightCreateInput" }
      responses:
        "201":
          description: Created Game Night
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightSummary" }
        "401":
          description: Sign-in required
  /game-nights/join:
    post:
      tags: [GameNights]
      operationId: joinGameNight
      summary: Join or request access using a Game Night code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightJoinInput" }
      responses:
        "200":
          description: Joined or pending host approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightJoinResponse" }
        "400":
          description: Invalid or unavailable join code
        "401":
          description: Sign-in required
  /game-nights/{gameNightId}:
    get:
      tags: [GameNights]
      operationId: getGameNight
      summary: Get a Game Night, its members, profiles, rules, games, and timeline
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Game Night workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightDetail" }
        "401":
          description: Sign-in required
        "403":
          description: Active membership required
        "404":
          description: Game Night not found
  /game-nights/{gameNightId}/members/{membershipId}:
    patch:
      tags: [GameNights]
      operationId: updateGameNightMembership
      summary: Accept, deny, or remove a Game Night member
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightMembershipAction" }
      responses:
        "200":
          description: Updated Game Night membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightMember" }
        "401":
          description: Sign-in required
        "403":
          description: Host or invited account required
        "404":
          description: Membership not found
  /game-nights/{gameNightId}/invites:
    post:
      tags: [GameNights]
      operationId: inviteToGameNight
      summary: Invite an account by username to a private Game Night
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightInviteInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightMember" }
        "400":
          description: Username not found or invitation invalid
        "401":
          description: Sign-in required
        "403":
          description: Host access required
  /game-nights/{gameNightId}/profiles:
    post:
      tags: [GameNights]
      operationId: createGameNightProfile
      summary: Add a family profile to a Game Night
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightProfileInput" }
      responses:
        "201":
          description: Family profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightProfile" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
  /game-nights/{gameNightId}/profiles/{profileId}:
    patch:
      tags: [GameNights]
      operationId: updateGameNightProfile
      summary: Rename or archive a Game Night family profile
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightProfileUpdate" }
      responses:
        "200":
          description: Updated family profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightProfile" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
        "404":
          description: Profile not found
  /game-nights/{gameNightId}/house-rules/{gameSlug}:
    put:
      tags: [GameNights]
      operationId: saveGameNightHouseRules
      summary: Set house rules and an article-specific rules version
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gameSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightHouseRulesInput" }
      responses:
        "200":
          description: Saved house rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightHouseRules" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
  /game-nights/{gameNightId}/local-games:
    post:
      tags: [GameNights]
      operationId: createGameNightLocalGame
      summary: Create a Game Night-only local game
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightLocalGameInput" }
      responses:
        "201":
          description: Local game created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightLocalGame" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
  /game-nights/{gameNightId}/local-games/{localGameId}:
    put:
      tags: [GameNights]
      operationId: updateGameNightLocalGame
      summary: Edit a Game Night-only local game
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: localGameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightLocalGameInput" }
      responses:
        "200":
          description: Local game updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightLocalGame" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
        "404":
          description: Local game not found
    delete:
      tags: [GameNights]
      operationId: deleteGameNightLocalGame
      summary: Remove a local game from a Game Night
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: localGameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Local game removed
        "401":
          description: Sign-in required
        "403":
          description: Host access required
        "404":
          description: Local game not found
  /game-nights/{gameNightId}/games/{gameSlug}:
    put:
      tags: [GameNights]
      operationId: saveGameNightGame
      summary: Add or update a game and its nested variations
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gameSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNightGameInput" }
      responses:
        "200":
          description: Game added to the Game Night
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNightGameSelection" }
        "401":
          description: Sign-in required
        "403":
          description: Host access required
        "404":
          description: Catalog or local game not found
    delete:
      tags: [GameNights]
      operationId: removeGameNightGame
      summary: Remove a game from the Game Night navigation
      parameters:
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gameSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Game removed
        "401":
          description: Sign-in required
        "403":
          description: Host access required
        "404":
          description: Game selection not found
  /games/{gameSlug}/sessions:
    post:
      tags: [Community]
      operationId: startGameSession
      summary: Start and save a game session
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Started game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid players
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /games/sessions/{sessionId}:
    get:
      tags: [Community]
      operationId: getGameSession
      summary: Get a saved session owned by the signed-in user
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "401":
          description: Sign-in required
        "404":
          description: Session not found
    patch:
      tags: [Community]
      operationId: finishGameSession
      summary: Save final scores and complete a game session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionFinish"
      responses:
        "200":
          description: Completed game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid final scores
        "401":
          description: Sign-in required
        "404":
          description: Session not found
    put:
      tags: [Community]
      operationId: updateGameSession
      summary: Edit a completed game in the signed-in user's history
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionUpdate"
      responses:
        "200":
          description: Updated game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid game session
        "401":
          description: Sign-in required
        "404":
          description: Session or game not found
    delete:
      tags: [Community]
      operationId: deleteGameSession
      summary: Delete a completed game from the signed-in user's history
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Game session deleted
        "401":
          description: Sign-in required
        "404":
          description: Session not found
  /games/{gameSlug}/modes/{modeId}/leaderboard:
    get:
      tags: [Community]
      operationId: getGameLeaderboard
      summary: Get the best completed scores for a game
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
        - name: modeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
  /games/{gameSlug}/modes/{modeId}/leaderboard/global:
    get:
      tags: [Community]
      operationId: getGlobalGameLeaderboard
      summary: Get the global family-profile leaderboard
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema: { type: string }
        - name: modeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Global leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "401":
          description: Sign-in required
  /games/{gameSlug}/modes/{modeId}/leaderboard/family/{gameNightId}:
    get:
      tags: [Community]
      operationId: getFamilyGameLeaderboard
      summary: Get the current Game Night family leaderboard
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema: { type: string }
        - name: modeId
          in: path
          required: true
          schema: { type: string }
        - name: gameNightId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Family leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "401":
          description: Sign-in required
        "403":
          description: Active Game Night membership required
components:
  schemas:
    GameNightCreateInput:
      type: object
      required: [name, accessMode]
      properties:
        name: { type: string, minLength: 2, maxLength: 48 }
        accessMode: { type: string, enum: [public, invitational, private] }
    GameNightJoinInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 4, pattern: "^[A-Z]{4}$" }
    GameNightSummary:
      type: object
      required: [id, name, accessMode, joinCode, role, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        accessMode: { type: string, enum: [public, invitational, private] }
        joinCode: { type: ["string", "null"] }
