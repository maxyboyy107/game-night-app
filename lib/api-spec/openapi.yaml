openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Catalog
    description: Shared game catalog and protected admin editing.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Community
    description: User profiles, favorites, game sessions, and leaderboards.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get the shared game catalog
      responses:
        "200":
          description: Current catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
    put:
      tags: [Catalog]
      operationId: saveCatalog
      summary: Save the shared game catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "200":
          description: Saved catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
  /catalog/backup:
    get:
      tags: [Catalog]
      operationId: exportCatalogBackup
      summary: Export the shared catalog for safekeeping
      responses:
        "200":
          description: Downloadable catalog backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBackup"
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
    put:
      tags: [Catalog]
      operationId: restoreCatalogBackup
      summary: Restore the shared catalog from a backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogBackupInput"
      responses:
        "200":
          description: Catalog backup restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogState"
        "400":
          description: Invalid backup
        "401":
          description: Sign-in required
        "403":
          description: Admin unlock required
  /catalog/admin/unlock:
    post:
      tags: [Catalog]
      operationId: unlockCatalogAdmin
      summary: Unlock catalog editing for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockInput"
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUnlockResponse"
        "401":
          description: Sign-in required
        "403":
          description: Incorrect admin password
  /catalog/admin/status:
    get:
      tags: [Catalog]
      operationId: getCatalogAdminStatus
      summary: Check whether catalog editing is unlocked
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatusResponse"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a signed-in user's image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Sign-in required
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
  /profile:
    get:
      tags: [Community]
      operationId: getProfile
      summary: Get the signed-in user's profile and game history
      responses:
        "200":
          description: Profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
    put:
      tags: [Community]
      operationId: updateProfile
      summary: Change the signed-in user's display username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid username
        "401":
          description: Sign-in required
        "409":
          description: Username already in use
  /profile/games:
    get:
      tags: [Community]
      operationId: getProfileGames
      summary: Get all saved games for the signed-in user
      responses:
        "200":
          description: Saved game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionList"
        "401":
          description: Sign-in required
    post:
      tags: [Community]
      operationId: createHistoricalGame
      summary: Add a previously played game to the signed-in user's history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalGameInput"
      responses:
        "201":
          description: Historical game added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid historical game
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /profile/backup:
    get:
      tags: [Community]
      operationId: exportProfileBackup
      summary: Export the signed-in user's profile, family, and game history
      responses:
        "200":
          description: Downloadable profile backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBackup"
        "401":
          description: Sign-in required
    post:
      tags: [Community]
      operationId: restoreProfileBackup
      summary: Restore profile data from a backup for the same account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileBackupInput"
      responses:
        "200":
          description: Profile backup restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid backup or account mismatch
        "401":
          description: Sign-in required
  /profile/avatar:
    put:
      tags: [Community]
      operationId: updateProfileAvatar
      summary: Save a profile image uploaded to App Storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileAvatarUpdate"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "401":
          description: Sign-in required
  /profile/family-members:
    post:
      tags: [Community]
      operationId: createFamilyMember
      summary: Add a family profile to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberInput"
      responses:
        "201":
          description: Created family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "400":
          description: Invalid family member name
        "401":
          description: Sign-in required
  /profile/family-members/{familyMemberId}:
    patch:
      tags: [Community]
      operationId: updateFamilyMember
      summary: Rename or archive a family profile owned by the signed-in account
      parameters:
        - name: familyMemberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberUpdate"
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "400":
          description: Invalid update
        "401":
          description: Sign-in required
        "404":
          description: Family member not found
  /profile/family-members/{familyMemberId}/history:
    get:
      tags: [Community]
      operationId: getFamilyMemberHistory
      summary: Get completed games for a family profile owned by the signed-in account
      parameters:
        - name: familyMemberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Family member profile and completed game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberHistory"
        "401":
          description: Sign-in required
        "404":
          description: Family member not found
  /profile/favorites/{gameSlug}:
    put:
      tags: [Community]
      operationId: setGameFavorite
      summary: Add or remove a game from the signed-in user's favorites
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteUpdate"
      responses:
        "200":
          description: Favorite state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /games/{gameSlug}/sessions:
    post:
      tags: [Community]
      operationId: startGameSession
      summary: Start and save a game session
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Started game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid players
        "401":
          description: Sign-in required
        "404":
          description: Game not found
  /games/sessions/{sessionId}:
    get:
      tags: [Community]
      operationId: getGameSession
      summary: Get a saved session owned by the signed-in user
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "401":
          description: Sign-in required
        "404":
          description: Session not found
    patch:
      tags: [Community]
      operationId: finishGameSession
      summary: Save final scores and complete a game session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionFinish"
      responses:
        "200":
          description: Completed game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid final scores
        "401":
          description: Sign-in required
        "404":
          description: Session not found
    put:
      tags: [Community]
      operationId: updateGameSession
      summary: Edit a completed game in the signed-in user's history
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionUpdate"
      responses:
        "200":
          description: Updated game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "400":
          description: Invalid game session
        "401":
          description: Sign-in required
        "404":
          description: Session or game not found
    delete:
      tags: [Community]
      operationId: deleteGameSession
      summary: Delete a completed game from the signed-in user's history
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Game session deleted
        "401":
          description: Sign-in required
        "404":
          description: Session not found
  /games/{gameSlug}/modes/{modeId}/leaderboard:
    get:
      tags: [Community]
      operationId: getGameLeaderboard
      summary: Get the best completed scores for a game
      parameters:
        - name: gameSlug
          in: path
          required: true
          schema:
            type: string
        - name: modeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameCategory:
      type: object
      required: [slug, name, description, color]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        children:
          type: array
          items: { type: string }
    ScorekeeperMode:
      type: object
      required: [id, name, strategy]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 48 }
        strategy: { type: string, enum: [points, winner] }
        direction: { type: string, enum: [highest, lowest] }
    Game:
      type: object
      required: [slug, title, alternateNames, categorySlugs, eyebrow, description, players, setup, age, duration, equipment, objective, rules, accent, icon]
      properties:
        slug: { type: string }
        title: { type: string }
        alternateNames: { type: array, items: { type: string } }
        categorySlugs: { type: array, items: { type: string } }
        eyebrow: { type: string }
        description: { type: string }
        players: { type: string }
        setup: { type: string }
        age: { type: string }
        duration: { type: string }
        equipment: { type: array, items: { type: string } }
        objective: { type: string }
        rules: { type: array, items: { type: string } }
        accent: { type: string }
        icon: { type: string }
        articleMarkdown: { type: string }
        scorekeeperModes: { type: array, items: { $ref: "#/components/schemas/ScorekeeperMode" } }
        variations: { type: array, items: { type: string } }
    InventoryItem:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        imageDataUrl: { type: [string, "null"] }
        imagePath: { type: [string, "null"] }
    CatalogState:
      type: object
      required: [categories, primaryCategories, games, inventory]
      properties:
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GameCategory"
        primaryCategories: { type: array, items: { type: string } }
        games: { type: array, items: { $ref: "#/components/schemas/Game" } }
        inventory:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/InventoryItem" }
    CatalogInput:
      $ref: "#/components/schemas/CatalogState"
    CatalogBackup:
      type: object
      required: [schemaVersion, createdAt, catalog]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        createdAt: { type: string, format: date-time }
        catalog: { $ref: "#/components/schemas/CatalogState" }
    CatalogBackupInput:
      $ref: "#/components/schemas/CatalogBackup"
    AdminUnlockInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminUnlockResponse:
      type: object
      required: [unlocked]
      properties:
        unlocked: { type: boolean }
    AdminStatusResponse:
      type: object
      required: [unlocked]
      properties:
        unlocked: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ProfileUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[a-zA-Z0-9_]+$"
    ProfileAvatarUpdate:
      type: object
      required: [avatarPath]
      properties:
        avatarPath: { type: string, minLength: 1 }
    ProfileStats:
      type: object
      required: [gamesPlayed, wins, highScore]
      properties:
        gamesPlayed: { type: integer }
        wins: { type: integer }
        highScore: { type: integer }
    SessionPlayerInput:
      type: object
      required: [name, isYou]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        isYou: { type: boolean }
        familyMemberId: { type: ["string", "null"], format: uuid }
    SessionPlayer:
      type: object
      required: [name, score, isYou, familyMemberId, isWinner]
      properties:
        name: { type: string }
        score: { type: [integer, "null"] }
        isYou: { type: boolean }
        familyMemberId: { type: ["string", "null"], format: uuid }
        isWinner: { type: boolean }
    GameSessionInput:
      type: object
      required: [players, modeId]
      properties:
        modeId: { type: string, minLength: 1 }
        variation: { type: ["string", "null"] }
        note: { type: ["string", "null"], maxLength: 1000 }
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayerInput" }
    GameSessionFinish:
      type: object
      required: [players]
      properties:
        note: { type: ["string", "null"], maxLength: 1000 }
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayer" }
    HistoricalGameInput:
      type: object
      required: [gameSlug, modeId, playedAt, players]
      properties:
        gameSlug: { type: string, minLength: 1 }
        modeId: { type: string, minLength: 1 }
        variation: { type: ["string", "null"] }
        note: { type: ["string", "null"], maxLength: 1000 }
        playedAt: { type: string, format: date-time }
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayer" }
    GameSessionUpdate:
      type: object
      required: [gameSlug, modeId, playedAt, players]
      properties:
        gameSlug: { type: string, minLength: 1 }
        modeId: { type: string, minLength: 1 }
        variation: { type: ["string", "null"] }
        note: { type: ["string", "null"], maxLength: 1000 }
        playedAt: { type: string, format: date-time }
        players:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/SessionPlayer" }
    GameSession:
      type: object
      required: [id, gameSlug, players, score, status, won, startedAt, modeId, modeName, strategy, scoreDirection, variation, note, source, playedAt]
      properties:
        id: { type: string, format: uuid }
        gameSlug: { type: string }
        gameTitle: { type: string }
        players: { type: array, items: { $ref: "#/components/schemas/SessionPlayer" } }
        score: { type: [integer, "null"] }
        status: { type: string, enum: [active, complete] }
        winnerName: { type: [string, "null"] }
        won: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        modeId: { type: string }
        modeName: { type: string }
        strategy: { type: string, enum: [points, winner] }
        scoreDirection: { type: ["string", "null"], enum: [highest, lowest, null] }
        variation: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        source: { type: string, enum: [live, historical] }
        playedAt: { type: string, format: date-time }
    GameSessionList:
      type: object
      required: [games]
      properties:
        games: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
    ProfileBackup:
      type: object
      required: [schemaVersion, accountId, createdAt, username, avatarPath, favorites, familyMembers, games]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        accountId: { type: string }
        createdAt: { type: string, format: date-time }
        username: { type: string }
        avatarPath: { type: ["string", "null"] }
        favorites: { type: array, items: { type: string } }
        familyMembers: { type: array, items: { $ref: "#/components/schemas/FamilyMember" } }
        games: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
    ProfileBackupInput:
      $ref: "#/components/schemas/ProfileBackup"
    ProfileSummary:
      type: object
      required: [username, favorites, stats, recentGames, bestGames, familyMembers]
      properties:
        username: { type: string }
        avatarPath: { type: [string, "null"] }
        favorites: { type: array, items: { type: string } }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        recentGames: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
        bestGames: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
        familyMembers: { type: array, items: { $ref: "#/components/schemas/FamilyMember" } }
    FamilyMember:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    FamilyMemberInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
    FamilyMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        isActive: { type: boolean }
    FamilyMemberHistory:
      type: object
      required: [id, name, isActive, stats, recentGames]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        recentGames: { type: array, items: { $ref: "#/components/schemas/GameSession" } }
    FavoriteUpdate:
      type: object
      required: [favorited]
      properties:
        favorited: { type: boolean }
    FavoriteResponse:
      type: object
      required: [gameSlug, favorited]
      properties:
        gameSlug: { type: string }
        favorited: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [id, username, avatarPath, familyMemberId, score, gamesPlayed, wins]
      properties:
        id: { type: string }
        username: { type: string }
        avatarPath: { type: [string, "null"] }
        familyMemberId: { type: ["string", "null"], format: uuid }
        score: { type: ["integer", "null"] }
        gamesPlayed: { type: integer }
        wins: { type: integer }
    Leaderboard:
      type: object
      required: [gameSlug, modeId, strategy, scoreDirection, entries]
      properties:
        gameSlug: { type: string }
        modeId: { type: string }
        strategy: { type: string, enum: [points, winner] }
        scoreDirection: { type: ["string", "null"], enum: [highest, lowest, null] }
        entries: { type: array, items: { $ref: "#/components/schemas/LeaderboardEntry" } }

